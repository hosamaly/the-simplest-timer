    <meta name="description" content="A simple, mindful timer app">

    <title>Mindful Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2a2a2a;
            border: none;
            color: #ffffff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            z-index: 1000;
        }

        .menu-btn:hover {
            background: #3a3a3a;
        }

        .menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 26, 0.98);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        .menu.active {
            display: flex;
        }

        .menu-content {
            background: #2a2a2a;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
        }

        .menu-title {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .preset-btn {
            background: #3a3a3a;
            border: 2px solid #4a4a4a;
            color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .preset-btn:hover, .preset-btn.active {
            background: #4a90e2;
            border-color: #4a90e2;
        }

        .custom-input {
            margin-top: 20px;
        }

        .custom-input label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #aaa;
        }

        .custom-input input {
            width: 100%;
            background: #3a3a3a;
            border: 2px solid #4a4a4a;
            color: #ffffff;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
        }

        .custom-input input[type="range"] {
            padding: 0;
            height: 40px;
            cursor: pointer;
        }

        .custom-input input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4a90e2;
            cursor: pointer;
        }

        .custom-input input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4a90e2;
            cursor: pointer;
            border: none;
        }

        .close-menu-btn {
            width: 100%;
            background: #4a90e2;
            border: none;
            color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .close-menu-btn:hover {
            background: #357abd;
        }

        .timer-button-container {
            position: relative;
            width: 80vmin;
            height: 80vmin;
            max-width: 500px;
            max-height: 500px;
        }

        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            pointer-events: none;
            z-index: 2;
        }

        .progress-ring-circle {
            stroke: #333333;
            fill: transparent;
            stroke-width: 4;
        }

        .progress-ring-progress {
            stroke: #4a90e2;
            fill: transparent;
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s linear;
        }

        .timer-button {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #4a90e2;
            background: transparent;
            color: #ffffff;
            font-size: 18px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 1;
        }

        .timer-button:hover {
            transform: scale(1.02);
        }

        .timer-button:active {
            transform: scale(0.98);
        }

        .timer-button.running {
            background: #000000;
            border-color: #e74c3c;
        }

        .timer-button .button-text {
            font-size: 48px;
            font-weight: 600;
        }

        .timer-button .duration-text {
            font-size: 24px;
            color: #aaa;
        }

        .timer-button.running .progress-ring-progress {
            stroke: #e74c3c;
        }

        @media (max-width: 600px) {
            .preset-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <button class="menu-btn" id="menuBtn">⚙</button>

    <div class="menu" id="menu">
        <div class="menu-content">
            <h2 class="menu-title">Timer Duration</h2>
            <div class="preset-buttons">
                <button class="preset-btn" data-seconds="30">30s</button>
                <button class="preset-btn" data-seconds="60">60s</button>
                <button class="preset-btn active" data-seconds="90">90s</button>
                <button class="preset-btn" data-seconds="120">2m</button>
                <button class="preset-btn" data-seconds="300">5m</button>
                <button class="preset-btn" data-seconds="600">10m</button>
            </div>
            <div class="custom-input">
                <label for="customTime">Custom duration (seconds):</label>
                <input type="number" id="customTime" min="1" max="3600" placeholder="Enter seconds">
            </div>
            <div class="custom-input">
                <label for="volumeControl">Volume: <span id="volumeValue">50%</span></label>
                <input type="range" id="volumeControl" min="0" max="100" value="50">
            </div>
            <button class="close-menu-btn" id="closeMenu">Done</button>
        </div>
    </div>

    <div class="container">
        <div class="timer-button-container">
            <svg class="progress-ring" id="progressRing">
                <circle class="progress-ring-circle" id="progressBg" cx="50%" cy="50%"></circle>
                <circle class="progress-ring-progress" id="progressCircle" cx="50%" cy="50%"></circle>
            </svg>
            <button class="timer-button" id="timerButton">
                <div class="button-text">START</div>
                <div class="duration-text" id="durationDisplay">90 seconds</div>
            </button>
        </div>
    </div>

    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (event) => {
                    self.skipWaiting();
                });
                
                self.addEventListener('activate', (event) => {
                    event.waitUntil(clients.claim());
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl);
        }

        // App State
        let duration = 90; // Default 90 seconds
        let timeRemaining = duration;
        let timerId = null;
        let isRunning = false;
        let wakeLock = null;
        let volume = 0.5; // Default 50%

        // Load saved preferences from localStorage
        function loadPreferences() {
            const savedDuration = localStorage.getItem('timerDuration');
            const savedVolume = localStorage.getItem('timerVolume');
            
            if (savedDuration) {
                duration = parseInt(savedDuration);
            }
            
            if (savedVolume) {
                volume = parseFloat(savedVolume);
                volumeControl.value = Math.round(volume * 100);
                volumeValue.textContent = `${Math.round(volume * 100)}%`;
            }
        }

        // Save preferences to localStorage
        function savePreferences() {
            localStorage.setItem('timerDuration', duration.toString());
            localStorage.setItem('timerVolume', volume.toString());
        }

        // Elements
        const menuBtn = document.getElementById('menuBtn');
        const menu = document.getElementById('menu');
        const closeMenuBtn = document.getElementById('closeMenu');
        const timerButton = document.getElementById('timerButton');
        const durationDisplay = document.getElementById('durationDisplay');
        const presetButtons = document.querySelectorAll('.preset-btn');
        const customTimeInput = document.getElementById('customTime');
        const progressCircle = document.getElementById('progressCircle');
        const progressBg = document.getElementById('progressBg');
        const progressRing = document.getElementById('progressRing');
        const volumeControl = document.getElementById('volumeControl');
        const volumeValue = document.getElementById('volumeValue');

        // Progress circle setup - calculate based on actual SVG size
        function setupProgressCircle() {
            const container = document.querySelector('.timer-button-container');
            const size = container.offsetWidth;
            const radius = (size / 2) - 10; // Leave space for stroke width
            
            progressBg.setAttribute('r', radius);
            progressCircle.setAttribute('r', radius);
            
            const circumference = 2 * Math.PI * radius;
            progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
            progressCircle.style.strokeDashoffset = circumference;
            
            return circumference;
        }

        let circumference = setupProgressCircle();

        // Recalculate on resize
        window.addEventListener('resize', () => {
            circumference = setupProgressCircle();
        });

        function updateProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        // Audio generation (gentle chime) with volume control
        function playCompletionSound() {
            if (volume === 0) return; // Skip if muted
            
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3 * volume, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 1.5);

            // Add a second harmonic note
            setTimeout(() => {
                const osc2 = audioContext.createOscillator();
                const gain2 = audioContext.createGain();
                
                osc2.connect(gain2);
                gain2.connect(audioContext.destination);
                
                osc2.frequency.setValueAtTime(659.25, audioContext.currentTime); // E5
                osc2.type = 'sine';
                
                gain2.gain.setValueAtTime(0.2 * volume, audioContext.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1.5);
                
                osc2.start(audioContext.currentTime);
                osc2.stop(audioContext.currentTime + 1.5);
            }, 200);
        }

        // Wake Lock with error handling
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock released');
                    });
                }
            } catch (err) {
                // Log but don't show error to user - wake lock is a nice-to-have feature
                console.log('Wake Lock not available:', err.name, err.message);
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // Timer functions
        function formatDuration(seconds) {
            if (seconds < 60) {
                return `${seconds} seconds`;
            } else if (seconds % 60 === 0) {
                const minutes = seconds / 60;
                return `${minutes} minute${minutes > 1 ? 's' : ''}`;
            } else {
                const minutes = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${minutes}m ${secs}s`;
            }
        }

        function updateDisplay() {
            durationDisplay.textContent = formatDuration(duration);
        }

        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            timeRemaining = duration;
            timerButton.querySelector('.button-text').textContent = 'STOP';
            timerButton.classList.add('running');
            requestWakeLock();

            const startTime = Date.now();
            const endTime = startTime + (duration * 1000);

            timerId = setInterval(() => {
                const now = Date.now();
                timeRemaining = Math.max(0, Math.ceil((endTime - now) / 1000));
                
                const progress = ((duration - timeRemaining) / duration) * 100;
                updateProgress(progress);

                if (timeRemaining <= 0) {
                    stopTimer();
                    playCompletionSound();
                    // Vibrate when complete
                    if (navigator.vibrate) {
                        navigator.vibrate([200, 100, 200, 100, 200]);
                    }
                }
            }, 100);
        }

        function stopTimer() {
            isRunning = false;
            clearInterval(timerId);
            timerId = null;
            timerButton.querySelector('.button-text').textContent = 'START';
            timerButton.classList.remove('running');
            updateProgress(0);
            releaseWakeLock();
        }

        // Event listeners
        menuBtn.addEventListener('click', () => {
            menu.classList.add('active');
        });

        closeMenuBtn.addEventListener('click', () => {
            menu.classList.remove('active');
        });

        menu.addEventListener('click', (e) => {
            if (e.target === menu) {
                menu.classList.remove('active');
            }
        });

        timerButton.addEventListener('click', () => {
            if (isRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        });

        presetButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (isRunning) return; // Don't change duration while running
                
                presetButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                customTimeInput.value = '';
                
                duration = parseInt(btn.dataset.seconds);
                updateDisplay();
                savePreferences();
            });
        });

        customTimeInput.addEventListener('input', (e) => {
            if (isRunning) {
                e.target.value = '';
                return;
            }

            const value = parseInt(e.target.value);
            if (value > 0) {
                presetButtons.forEach(b => b.classList.remove('active'));
                duration = value;
                updateDisplay();
                savePreferences();
            }
        });

        volumeControl.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            volume = value / 100;
            volumeValue.textContent = `${value}%`;
            savePreferences();
        });

        // Handle visibility change to re-acquire wake lock
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isRunning) {
                requestWakeLock();
            }
        });

        // Initialize
        loadPreferences();
        updateDisplay();
        updateProgress(0);
        
        // Set active button based on saved duration
        presetButtons.forEach(btn => {
            if (parseInt(btn.dataset.seconds) === duration) {
                btn.classList.add('active');
            }
        });
    </script>
</body>
</html>
